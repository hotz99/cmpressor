[package]
name = "rust_compressor"
version = "0.1.0"
edition = "2021"

[build-dependencies]
prost-build = "0.13.3"
tonic-build = "0.12.3"

[dependencies]
futures-util = "0.3.31"
lapin = "2.5.0"
prost = "0.13.3"
tokio = { version = "1.41.0", features = ["full"] }
tonic = { version = "0.12.3", features = ["transport"] }
tonic-reflection = "0.12.3"
uuid = { version = "1.11.0", features = ["v4"] }

[[bin]]
name = "rust_compressor"
path = "src/main.rs"
