syntax = "proto3";

option csharp_namespace = "RabbitmqRpc.CompressionProtobuf";

enum Codec {
  H264 = 0;
  H265 = 1;
}

message Request {
  // input binary data
  bytes video_data = 1;
  Codec codec = 2;
}

message Response {
  bool success = 1;
  // optional error/status message
  optional string message = 2;
  // output binary data, null when compression fails
  optional bytes compressed_video = 3;
}

service Service { rpc Compress(Request) returns (Response); }
